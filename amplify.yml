version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 # Ensures compatibility with Tailwind CSS 4
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
